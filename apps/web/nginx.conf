server {
  listen 3001;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Redirects stay relative so they keep the public scheme and host behind a proxy.
  absolute_redirect off;

  # Canonical URLs have no trailing slash: /product/ -> /product (301).
  rewrite ^/(.+)/$ /$1 permanent;

  # Every public page is prerendered to <path>/index.html. Unknown paths get the
  # SPA fallback with a real 404 status, so the client renders the not-found
  # page while crawlers drop the URL.
  location / {
    try_files $uri $uri/index.html =404;
    error_page 404 /__spa-fallback.html;
  }

  location = /__spa-fallback.html {
    internal;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # nginx's stock mime.types has no entry for .webmanifest.
  location = /site.webmanifest {
    default_type application/manifest+json;
  }

  location /og/ {
    add_header Cache-Control "public, max-age=86400";
  }
}
