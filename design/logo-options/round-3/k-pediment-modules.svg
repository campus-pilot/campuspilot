  <g fill="currentColor">
    <rect x="12" y="27.5" width="18.5" height="12.5" rx="3"/>
    <rect x="33.5" y="27.5" width="18.5" height="12.5" rx="3"/>
    <rect x="12" y="43" width="18.5" height="12.5" rx="3"/>
    <rect x="33.5" y="43" width="18.5" height="12.5" rx="3"/>
  </g>
</svg>
