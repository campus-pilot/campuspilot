<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- J · Cap check: a graduation cap whose head is a completed check. -->
  <!-- Neutral parts use currentColor (flips with theme); accent parts use var(--mark-accent, currentColor), so the mark is monochrome unless an accent is set. -->
  <path d="M32 8 56 19 32 30 8 19Z" fill="currentColor" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M51.5 21.5V33" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M19 40 28 49 45.5 31.5" fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--mark-accent,currentColor)"/>
</svg>
