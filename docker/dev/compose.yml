name: campuspilot

services:
  postgres:
    image: postgres:18.6
    container_name: campuspilot-postgres
    environment:
      POSTGRES_DB: campuspilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "5432:5432"
    volumes:
      - campuspilot_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  restate:
    image: docker.restate.dev/restatedev/restate:1.7.9
    container_name: campuspilot-restate
    command: ["--node-name=restate-1"]
    ports:
      - "8080:8080"
      - "9070:9070"
      - "5122:5122"
    volumes:
      - ./restate_data:/restate-data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8.36.0
    container_name: campuspilot-gotenberg
    ports:
      - "8781:3000"
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    container_name: campuspilot-redis
    ports:
      - "6379:6379"
    volumes:
      - campuspilot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  opa:
    image: openpolicyagent/opa:1.20.2
    container_name: campuspilot-opa
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
    ports:
      - "8181:8181"
    restart: unless-stopped

volumes:
  campuspilot_postgres_data:
  campuspilot_redis_data:
