name: campuspilot-ayush-local

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: campuspilot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: campuspilot-local-only
    ports: ['127.0.0.1:55432:5432']
    volumes: ['postgres_data:/var/lib/postgresql']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d campuspilot']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:8.10.1-alpine
    ports: ['127.0.0.1:56379:6379']
    volumes: ['redis_data:/data']
    restart: unless-stopped
  rustfs-permissions:
    image: alpine:3.22
    user: '0:0'
    volumes: ['rustfs_data:/data', 'rustfs_logs:/logs']
    command: ['chown', '-R', '10001:10001', '/data', '/logs']
    restart: 'no'
  rustfs:
    image: rustfs/rustfs:1.0.0
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-RUSTFSLOCALDEV}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-campuspilot-local-rustfs}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_OBS_LOG_DIRECTORY: /logs
    ports: ['127.0.0.1:59000:9000', '127.0.0.1:59001:9001']
    volumes: ['rustfs_data:/data', 'rustfs_logs:/logs']
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/health']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  rustfs-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.39.3
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-RUSTFSLOCALDEV}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-campuspilot-local-rustfs}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_BUCKET: ${S3_BUCKET:-campuspilot}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3 mb "s3://$${S3_BUCKET}"
    restart: 'no'
  opa:
    image: openpolicyagent/opa:1.20.2
    command: ['run', '--server', '--watch', '--addr=0.0.0.0:8181', '/policies']
    ports: ['127.0.0.1:58181:8181']
    volumes: ['../../packages/opa/src/policies:/policies:ro']
    restart: unless-stopped
  gotenberg:
    image: gotenberg/gotenberg:8.36.0
    environment:
      CHROMIUM_DISABLE_JAVASCRIPT: 'true'
      CHROMIUM_DENY_PRIVATE_IPS: 'true'
      CHROMIUM_DENY_PUBLIC_IPS: 'true'
    ports: ['127.0.0.1:58781:3000']
    restart: unless-stopped
  restate:
    image: docker.restate.dev/restatedev/restate:1.7.9
    command: ['--node-name=campuspilot-local']
    ports: ['127.0.0.1:58080:8080', '127.0.0.1:59070:9070', '127.0.0.1:55122:5122']
    volumes: ['restate_data:/restate-data']
    extra_hosts: ['host.docker.internal:host-gateway']
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  rustfs_logs:
  restate_data:
